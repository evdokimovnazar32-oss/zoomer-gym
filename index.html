<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZoomerGymCourse</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0b0a10; --bg-card: #14111f;
            --border-subtle: rgba(139, 92, 246, 0.18);
            --accent: #8b5cf6; --accent-soft: rgba(139, 92, 246, 0.15);
            --accent-grad: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
            --text-main: #f3f1f8; --text-muted: #9ca3af; --radius: 18px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0 0 95px 0;
            background-color: var(--bg-main); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }
        .svg-icon { width: 24px; height: 24px; stroke: #c4b5fd; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .topbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: rgba(11, 10, 16, 0.9);
            backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .back-btn {
            display: none; align-items: center; gap: 6px;
            background: var(--bg-card); color: var(--text-main);
            border: 1px solid var(--border-subtle); border-radius: 10px;
            padding: 6px 12px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .brand-mini { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
        .container { padding: 16px; max-width: 520px; margin: 0 auto; }
        .hero-box {
            background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.25), transparent 70%), var(--bg-card);
            border: 1px solid var(--border-subtle); border-radius: 22px;
            padding: 24px 20px; text-align: center; margin-bottom: 20px;
        }
        .logo-badge {
            width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 16px;
            background: var(--accent-grad); display: flex; align-items: center; justify-content: center;
        }
        .hero-title { font-size: 23px; font-weight: 900; margin: 0; }
        .hero-quote { font-size: 13px; color: #c4b5fd; font-style: italic; margin: 6px 0 12px 0; }
        .hero-welcome { font-size: 14px; color: var(--text-muted); margin: 0 0 18px 0; }
        .btn-primary {
            width: 100%; padding: 14px 20px; background: var(--accent-grad); color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px;
            font-size: 15px; font-weight: 800; cursor: pointer; text-align: center; display: block;
        }
        .section-heading { font-size: 18px; font-weight: 800; margin: 12px 0 14px 0; }
        .grid-cards { display: flex; flex-direction: column; gap: 12px; }
        .nav-card {
            display: flex; align-items: center; gap: 14px; background: var(--bg-card);
            border: 1px solid var(--border-subtle); border-radius: var(--radius);
            padding: 16px; cursor: pointer;
        }
        .card-icon {
            width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .card-body { flex: 1; }
        .card-title { font-weight: 800; font-size: 16px; margin: 0 0 3px 0; }
        .card-desc { font-size: 13px; color: var(--text-muted); margin: 0; }
        .info-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
        }
        .info-card h3 { margin: 0 0 10px 0; font-size: 17px; color: #ede9fe; }
        .info-block { font-size: 14px; color: #d1d5db; margin-bottom: 8px; }
        .remember-box {
            margin-top: 12px; padding: 12px 14px; background: var(--accent-soft);
            border-left: 3px solid var(--accent); border-radius: 10px; font-size: 13px; color: #ede9fe;
        }
        .badge {
            display: inline-block; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 700;
            background: var(--accent-soft); color: #c4b5fd; margin-right: 6px; margin-bottom: 6px;
        }
        .pill-selector { display: flex; gap: 8px; flex-wrap: wrap; }
        .pill-btn {
            flex: 1; min-width: 80px; padding: 10px 12px; background: #09080e;
            border: 1px solid var(--border-subtle); border-radius: 12px; color: var(--text-muted);
            font-size: 13px; font-weight: 700; text-align: center; cursor: pointer;
        }
        .pill-btn.active { background: var(--accent-soft); border-color: var(--accent); color: #ffffff; }
        .input-field {
            width: 100%; background: #09080e; border: 1px solid var(--border-subtle);
            border-radius: 12px; color: var(--text-main); padding: 12px; font-size: 14px; margin-bottom: 10px;
        }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
            display: flex; justify-content: space-around; background: rgba(11, 10, 16, 0.95);
            backdrop-filter: blur(16px); border-top: 1px solid rgba(139, 92, 246, 0.15);
            padding: 10px 6px calc(10px + env(safe-area-inset-bottom));
        }
        .tab-btn {
            background: none; border: none; color: var(--text-muted);
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            font-size: 11px; font-weight: 700; cursor: pointer; padding: 4px 12px; border-radius: 12px;
        }
        .tab-btn.active { color: #c4b5fd; background: rgba(139, 92, 246, 0.1); }
    </style>
</head>
<body>
    <header class="topbar">
        <button id="backBtn" class="back-btn" onclick="goBack()">← Назад</button>
        <div class="brand-mini">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="9" width="4" height="6" rx="1.5" fill="#a78bfa"/>
                <rect x="18" y="9" width="4" height="6" rx="1.5" fill="#a78bfa"/>
                <rect x="6" y="6" width="3" height="12" rx="1.5" fill="#7c3aed"/>
                <rect x="15" y="6" width="3" height="12" rx="1.5" fill="#7c3aed"/>
                <rect x="9" y="10.5" width="6" height="3" fill="#ede9fe"/>
            </svg>
            <span>ZoomerGymCourse</span>
        </div>
    </header>

    <main id="appView" class="container"></main>

    <nav class="bottom-nav">
        <button class="tab-btn active" id="tab-home" onclick="navigate('home', null, true)">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Главная</span>
        </button>
        <button class="tab-btn" id="tab-workouts" onclick="navigate('workouts', null, true)">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
            <span>Тренировки</span>
        </button>
        <button class="tab-btn" id="tab-kbju" onclick="navigate('kbju', null, true)">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            <span>AI Калории</span>
        </button>
        <button class="tab-btn" id="tab-progress" onclick="navigate('progress', null, true)">
            <svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            <span>Прогресс</span>
        </button>
    </nav>

    <script>
        const APP_DATA = {
            nutrition: [
                { title: "Калории и Баланс", what: "Энергия из еды.", why: "Для похудения нужен дефицит, для массы — профицит.", remember: "Не голодай слишком сильно, иначе уйдут мышцы." },
                { title: "Белки", what: "Строительный материал для мышц.", why: "Без белка мышцы не восстановятся.", remember: "Норма: 1.6–2 г на 1 кг веса тела." },
                { title: "Жиры и Углеводы", what: "Жиры — гормоны, углеводы — энергия.", why: "Дают силы на тренировку.", remember: "Ешь сложные углеводы (крупы) и полезные жиры." }
            ],
            workoutsTheory: [
                { title: "Full Body", what: "Проработка всего тела за одну тренировку.", remember: "Лучший выбор для новичков (3 раза в неделю)." },
                { title: "Split", what: "Разделение мышечных групп по разным дням.", remember: "Для тех, кто тренируется от 3–6 месяцев." }
            ],
            muscleGroups: [
                { id: "Грудь", subtitle: "Жим лежа, отжимания", icon: "🦾" },
                { id: "Спина", subtitle: "Тяги, подтягивания", icon: "🦇" },
                { id: "Ноги", subtitle: "Приседания, жим ногами", icon: "🦵" },
                { id: "Плечи", subtitle: "Махи, жим над головой", icon: "🛡️" },
                { id: "Руки", subtitle: "Бицепс, трицепс", icon: "💪" }
            ],
            exercises: [
                { slug: "bench_press", name: "Жим штанги лежа", muscleGroup: "Грудь", equipment: "Штанга", difficulty: "Средняя", recommendedSets: 3, recommendedReps: "8–10", secondaryMuscles: ["Трицепс", "Плечи"], steps: ["Ляг на скамью, сведи лопатки.", "Опусти штангу к груди.", "Мощно выжми вверх."], mistakes: ["Отрыв таза", "Разведение локтей на 90°"] },
                { slug: "pull_ups", name: "Подтягивания", muscleGroup: "Спина", equipment: "Турник", difficulty: "Высокая", recommendedSets: 3, recommendedReps: "6–10", secondaryMuscles: ["Бицепс"], steps: ["Возьмись чуть шире плеч.", "Тянись грудью к перекладине.", "Плавно опустись."], mistakes: ["Раскачка корпуса", "Неполная амплитуда"] },
                { slug: "squat", name: "Приседания", muscleGroup: "Ноги", equipment: "Штанга", difficulty: "Высокая", recommendedSets: 3, recommendedReps: "8–10", secondaryMuscles: ["Ягодицы", "Кор"], steps: ["Ноги на ширине плеч.", "Присядь до параллели с полом.", "Встань, толкаясь пятками."], mistakes: ["Сведение коленей внутрь", "Округление спины"] }
            ],
            recovery: [
                { icon: "😴", title: "Сон", what: "Мышцы растут во сне.", remember: "Спи минимум 7–8 часов." },
                { icon: "💧", title: "Вода", what: "Важна для суставов и обмена веществ.", remember: "Пей 30 мл на 1 кг веса." }
            ],
            supplementsWarning: "Спортпит — это лишь добавка к еде. Главное — питание и сон.",
            supplements: [
                { name: "Креатин моногидрат", what: "Повышает силу и выносливость.", importance: "Топ-1 (Работает)" },
                { name: "Сывороточный протеин", what: "Помогает добрать норму белка.", importance: "Удобно" }
            ]
        };

        try {
            const tg = window.Telegram && window.Telegram.WebApp;
            if (tg) { tg.ready(); tg.expand(); }
        } catch (e) {}

        let navStack = [{ screen: 'home', param: null }];
        let builderState = { goal: 'hypertrophy', programType: 'FULL BODY' };

        function navigate(screen, param = null, resetStack = false) {
            if (resetStack) navStack = [{ screen, param }];
            else navStack.push({ screen, param });
            renderCurrent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            if (navStack.length > 1) { navStack.pop(); renderCurrent(); }
        }

        function updateNavUI() {
            document.getElementById('backBtn').style.display = navStack.length > 1 ? 'inline-flex' : 'none';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeTab = document.getElementById('tab-' + navStack[0].screen);
            if (activeTab) activeTab.classList.add('active');
        }

        function renderCurrent() {
            const current = navStack[navStack.length - 1];
            updateNavUI();
            const view = document.getElementById('appView');
            if (current.screen === 'home') renderHome(view);
            else if (current.screen === 'nutrition') renderNutrition(view);
            else if (current.screen === 'workouts') renderWorkouts(view);
            else if (current.screen === 'exercises') renderMuscleGroups(view);
            else if (current.screen === 'muscleList') renderExerciseList(view, current.param);
            else if (current.screen === 'exerciseDetail') renderExerciseDetail(view, current.param);
            else if (current.screen === 'recovery') renderRecovery(view);
            else if (current.screen === 'supplements') renderSupplements(view);
            else if (current.screen === 'kbju') renderKBJU(view);
            else if (current.screen === 'progress') renderProgress(view);
        }

        function renderHome(view) {
            view.innerHTML = `
                <div class="hero-box">
                    <div class="logo-badge">🔥</div>
                    <h1 class="hero-title">ZoomerGymCourse</h1>
                    <p class="hero-quote">«Всё начинается с малого.»</p>
                    <p class="hero-welcome">Разберись в тренировках, питании и росте мышц за пару минут без воды.</p>
                    <button class="btn-primary" onclick="navigate('workouts', null, true)">НАЧАТЬ ТРЕНИРОВКИ</button>
                </div>
                <h2 class="section-heading">Разделы курса</h2>
                <div class="grid-cards">
                    <div class="nav-card" onclick="navigate('nutrition')"><div class="card-icon">🍽</div><div class="card-body"><h3 class="card-title">Питание</h3><p class="card-desc">Калории, БЖУ, дефицит и профицит</p></div></div>
                    <div class="nav-card" onclick="navigate('workouts', null, true)"><div class="card-icon">⚡</div><div class="card-body"><h3 class="card-title">Тренировки</h3><p class="card-desc">Full Body vs Split и конструктор</p></div></div>
                    <div class="nav-card" onclick="navigate('exercises')"><div class="card-icon">💪</div><div class="card-body"><h3 class="card-title">Упражнения</h3><p class="card-desc">Техника по группам мышц</p></div></div>
                    <div class="nav-card" onclick="navigate('recovery')"><div class="card-icon">😴</div><div class="card-body"><h3 class="card-title">Восстановление</h3><p class="card-desc">Сон, вода и отдых</p></div></div>
                    <div class="nav-card" onclick="navigate('supplements')"><div class="card-icon">💊</div><div class="card-body"><h3 class="card-title">БАДы / Спортпит</h3><p class="card-desc">Что реально работает</p></div></div>
                </div>
            `;
        }

        function renderNutrition(view) {
            view.innerHTML = `<h2 class="section-heading">🍽 Основы питания</h2>` + APP_DATA.nutrition.map(i => `
                <div class="info-card"><h3>${i.title}</h3><div class="info-block"><b>Что это:</b> ${i.what}</div><div class="info-block"><b>Зачем:</b> ${i.why}</div><div class="remember-box">💡 ${i.remember}</div></div>
            `).join('') + `<button class="btn-primary" onclick="navigate('kbju', null, true)">Перейти к КБЖУ и AI Фото →</button>`;
        }

        function renderWorkouts(view) {
            view.innerHTML = `<h2 class="section-heading">🔥 Тренировки</h2>` + APP_DATA.workoutsTheory.map(t => `
                <div class="info-card"><h3>${t.title}</h3><div class="info-block">${t.what}</div><div class="remember-box">💡 ${t.remember}</div></div>
            `).join('') + `
                <div class="info-card">
                    <h3>⚙️ Конструктор программы</h3>
                    <div class="pill-selector" style="margin-bottom:10px;">
                        <button class="pill-btn active" onclick="setBuilder('programType','FULL BODY', this)">FULL BODY</button>
                        <button class="pill-btn" onclick="setBuilder('programType','SPLIT', this)">SPLIT</button>
                    </div>
                    <button class="btn-primary" onclick="buildUserPlan()">Сгенерировать план</button>
                </div>
                <div id="generatedPlanBox"></div>
            `;
        }

        function setBuilder(k, v, btn) {
            builderState[k] = v;
            btn.parentElement.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function buildUserPlan() {
            document.getElementById('generatedPlanBox').innerHTML = `
                <div class="info-card"><h3>📅 Базовая тренировка (${builderState.programType})</h3>` + APP_DATA.exercises.map((ex, i) => `
                    <div style="padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); display:flex; justify-content:space-between; cursor:pointer;" onclick="navigate('exerciseDetail', '${ex.slug}')">
                        <div><b>${i+1}. ${ex.name}</b><div style="font-size:12px; color:var(--text-muted);">${ex.muscleGroup}</div></div>
                        <span class="badge">${ex.recommendedSets} × ${ex.recommendedReps}</span>
                    </div>
                `).join('') + `</div>`;
        }

        function renderMuscleGroups(view) {
            view.innerHTML = `<h2 class="section-heading">💪 Группы мышц</h2><div class="grid-cards">` + APP_DATA.muscleGroups.map(m => `
                <div class="nav-card" onclick="navigate('muscleList', '${m.id}')"><div class="card-icon">${m.icon}</div><div class="card-body"><h3 class="card-title">${m.id}</h3><p class="card-desc">${m.subtitle}</p></div></div>
            `).join('') + `</div>`;
        }

        function renderExerciseList(view, group) {
            const list = APP_DATA.exercises.filter(e => e.muscleGroup === group);
            view.innerHTML = `<h2 class="section-heading">${group}</h2><div class="grid-cards">` + (list.length ? list.map(ex => `
                <div class="nav-card" onclick="navigate('exerciseDetail', '${ex.slug}')"><div class="card-icon">🏋️</div><div class="card-body"><h3 class="card-title">${ex.name}</h3><p class="card-desc">${ex.equipment} • ${ex.recommendedSets} × ${ex.recommendedReps}</p></div></div>
            `).join('') : `<div class="info-card">Упражнения скоро добавятся!</div>`) + `</div>`;
        }

        function renderExerciseDetail(view, slug) {
            const ex = APP_DATA.exercises.find(e => e.slug === slug);
            if (!ex) return;
            view.innerHTML = `
                <h2 class="section-heading">${ex.name}</h2>
                <div style="margin-bottom:12px;"><span class="badge">Сложность: ${ex.difficulty}</span><span class="badge">Подходы: ${ex.recommendedSets} × ${ex.recommendedReps}</span></div>
                <div class="info-card"><h3>✅ Техника</h3>${ex.steps.map((s,i)=>`<div class="info-block"><b>${i+1}.</b> ${s}</div>`).join('')}</div>
                <div class="info-card"><h3>⚠️ Ошибки</h3>${ex.mistakes.map(m=>`<div class="info-block">• ${m}</div>`).join('')}</div>
            `;
        }

        function renderRecovery(view) {
            view.innerHTML = `<h2 class="section-heading">😴 Восстановление</h2>` + APP_DATA.recovery.map(r => `
                <div class="info-card"><h3>${r.icon} ${r.title}</h3><div class="info-block">${r.what}</div><div class="remember-box">💡 ${r.remember}</div></div>
            `).join('');
        }

        function renderSupplements(view) {
            view.innerHTML = `<h2 class="section-heading">💊 БАДы</h2><div class="remember-box" style="margin-bottom:14px;">⚠️ ${APP_DATA.supplementsWarning}</div>` + APP_DATA.supplements.map(s => `
                <div class="info-card"><h3>${s.name}</h3><span class="badge">${s.importance}</span><div class="info-block">${s.what}</div></div>
            `).join('');
        }

        // КАЛЬКУЛЯТОР КБЖУ + AI ФОТО СНИЗУ
        function renderKBJU(view) {
            view.innerHTML = `
                <h2 class="section-heading">🔥 Расчет КБЖУ и AI Калории</h2>
                <div class="info-card">
                    <h3>🧮 Калькулятор нормы калорий</h3>
                    <input id="calcWeight" type="number" class="input-field" placeholder="Твой вес (кг), например 70">
                    <input id="calcHeight" type="number" class="input-field" placeholder="Твой рост (см), например 178">
                    <input id="calcAge" type="number" class="input-field" placeholder="Возраст (лет), например 20">
                    <select id="calcGoal" class="input-field">
                        <option value="loss">Похудение / Сушка (дефицит)</option>
                        <option value="maint" selected>Поддержание формы</option>
                        <option value="gain">Набор мышечной массы (профицит)</option>
                    </select>
                    <button class="btn-primary" onclick="calculateKBJU()">Рассчитать мою норму</button>
                    <div id="kbjuResult" style="margin-top:14px;"></div>
                </div>

                <div class="info-card">
                    <h3>📸 AI Подсчет калорий по фото</h3>
                    <p style="font-size:13px; color:var(--text-muted); margin-top:0;">Загрузи фото своей тарелки для быстрой оценки или отправь его в чат боту для полного разбора от Gemini AI:</p>
                    <input type="file" id="foodPhotoInput" accept="image/*" style="display:none" onchange="previewFoodPhoto(event)">
                    <button class="btn-primary" style="margin-bottom:10px;" onclick="document.getElementById('foodPhotoInput').click()">📷 Загрузить фото блюда</button>
                    <div id="photoPreviewBox" style="display:none; margin-top:12px;">
                        <img id="foodPreviewImg" style="width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-bottom:10px;">
                        <div id="aiPhotoAnalysis" class="remember-box"></div>
                        <button class="btn-primary" style="margin-top:10px; background:#2e1065;" onclick="if(window.Telegram&&window.Telegram.WebApp) window.Telegram.WebApp.close();">📤 Точный разбор через чат с ботом</button>
                    </div>
                </div>
            `;
        }

        function calculateKBJU() {
            const w = parseFloat(document.getElementById('calcWeight').value);
            const h = parseFloat(document.getElementById('calcHeight').value);
            const a = parseFloat(document.getElementById('calcAge').value);
            const goal = document.getElementById('calcGoal').value;
            if (!w || !h || !a) {
                document.getElementById('kbjuResult').innerHTML = `<div class="remember-box">Заполни вес, рост и возраст!</div>`;
                return;
            }
            let bmr = (10 * w) + (6.25 * h) - (5 * a) + 5;
            let cal = Math.round(bmr * 1.45);
            if (goal === 'loss') cal -= 350;
            if (goal === 'gain') cal += 350;
            const p = Math.round(w * 1.8);
            const f = Math.round(w * 0.9);
            const c = Math.max(50, Math.round((cal - (p * 4 + f * 9)) / 4));
            document.getElementById('kbjuResult').innerHTML = `
                <div class="remember-box">
                    🔥 <b>Твоя норма: ${cal} ккал / день</b><br>
                    🥩 Белки: <b>${p} г</b> • 🥑 Жиры: <b>${f} г</b> • 🍚 Углеводы: <b>${c} г</b>
                </div>
            `;
        }

        function previewFoodPhoto(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                document.getElementById('photoPreviewBox').style.display = 'block';
                document.getElementById('foodPreviewImg').src = ev.target.result;
                document.getElementById('aiPhotoAnalysis').innerHTML = `⏳ <b>AI оценивает порцию...</b>`;
                setTimeout(() => {
                    document.getElementById('aiPhotoAnalysis').innerHTML = `
                        🍽 <b>Примерная AI-оценка порции (~350 г):</b><br>
                        🔥 Калории: <b>~480 ккал</b><br>
                        🥩 Белки: <b>~28 г</b> | 🥑 Жиры: <b>~18 г</b> | 🍚 Углеводы: <b>~46 г</b><br><br>
                        <i>Для распознавания каждого ингредиента по картинке через Gemini отправь это фото прямо в чат боту!</i>
                    `;
                }, 900);
            };
            reader.readAsDataURL(file);
        }

        function renderProgress(view) {
            const data = JSON.parse(localStorage.getItem('zgc_progress') || '{"weights":[]}');
            view.innerHTML = `
                <h2 class="section-heading">📊 Прогресс</h2>
                <div class="info-card">
                    <h3>⚖️ Записать вес тела</h3>
                    <div style="display:flex; gap:8px;">
                        <input id="pBodyWeight" type="number" step="0.1" class="input-field" style="margin:0;" placeholder="Вес в кг">
                        <button class="btn-primary" style="width:auto; padding:0 22px;" onclick="addBodyWeight()">+</button>
                    </div>
                    <div style="margin-top:12px;">
                        ${data.weights.map(w => `<span class="badge">${w.val} кг</span>`).join('') || '<span style="font-size:13px; color:var(--text-muted);">Записей пока нет</span>'}
                    </div>
                </div>
            `;
        }

        function addBodyWeight() {
            const val = parseFloat(document.getElementById('pBodyWeight').value);
            if (!val) return;
            let data = JSON.parse(localStorage.getItem('zgc_progress') || '{"weights":[]}');
            data.weights.push({ val });
            localStorage.setItem('zgc_progress', JSON.stringify(data));
            renderProgress(document.getElementById('appView'));
        }

        window.addEventListener('DOMContentLoaded', renderCurrent);
        renderCurrent();
    </script>
</body>
</html>
