<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZoomerGymCourse</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0b0a10;
            --bg-card: #14111f;
            --border-subtle: rgba(139, 92, 246, 0.18);
            --accent: #8b5cf6;
            --accent-soft: rgba(139, 92, 246, 0.15);
            --accent-grad: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
            --text-main: #f3f1f8;
            --text-muted: #9ca3af;
            --radius: 18px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0 0 90px 0;
            background-color: var(--bg-main); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }
        .svg-icon { width: 24px; height: 24px; stroke: #c4b5fd; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .topbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: rgba(11, 10, 16, 0.9);
            backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .back-btn {
            display: none; align-items: center; gap: 6px;
            background: var(--bg-card); color: var(--text-main);
            border: 1px solid var(--border-subtle); border-radius: 10px;
            padding: 6px 12px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .brand-mini { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
        .container { padding: 16px; max-width: 520px; margin: 0 auto; }
        .hero-box {
            background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.25), transparent 70%), var(--bg-card);
            border: 1px solid var(--border-subtle); border-radius: 22px;
            padding: 24px 20px; text-align: center; margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }
        .logo-badge {
            width: 60px; height: 60px; margin: 0 auto 14px; border-radius: 16px;
            background: var(--accent-grad); display: flex; align-items: center; justify-content: center;
        }
        .hero-title { font-size: 24px; font-weight: 900; margin: 0; }
        .hero-quote { font-size: 13px; color: #c4b5fd; font-style: italic; margin: 6px 0 14px 0; }
        .hero-welcome { font-size: 14px; color: var(--text-muted); margin: 0 0 20px 0; }
        .btn-primary {
            width: 100%; padding: 14px 20px; background: var(--accent-grad); color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px;
            font-size: 15px; font-weight: 800; cursor: pointer; text-align: center; display: block; text-decoration: none;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
        }
        .section-heading { font-size: 18px; font-weight: 800; margin: 12px 0 14px 0; }
        .grid-cards { display: flex; flex-direction: column; gap: 12px; }
        .nav-card {
            display: flex; align-items: center; gap: 14px; background: var(--bg-card);
            border: 1px solid var(--border-subtle); border-radius: var(--radius);
            padding: 16px; cursor: pointer;
        }
        .card-icon {
            width: 50px; height: 50px; border-radius: 14px; background: var(--accent-soft);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        .card-body { flex: 1; }
        .card-title { font-weight: 800; font-size: 16px; margin: 0 0 3px 0; }
        .card-desc { font-size: 13px; color: var(--text-muted); margin: 0; }
        .info-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
        }
        .info-card h3 { margin: 0 0 10px 0; font-size: 17px; color: #ede9fe; }
        .info-block { font-size: 14px; color: #d1d5db; margin-bottom: 8px; }
        .remember-box {
            margin-top: 12px; padding: 12px 14px; background: var(--accent-soft);
            border-left: 3px solid var(--accent); border-radius: 10px; font-size: 13px; color: #ede9fe;
        }
        .badge {
            display: inline-block; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 700;
            background: var(--accent-soft); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.2);
            margin-right: 6px; margin-bottom: 6px;
        }
        .media-box { width: 100%; border-radius: 14px; overflow: hidden; background: #12101b; border: 1px solid var(--border-subtle); margin-bottom: 14px; }
        .media-box img { width: 100%; display: block; max-height: 260px; object-fit: cover; }
        .media-placeholder { padding: 40px 16px; text-align: center; color: #a78bfa; font-size: 13px; }
        .pill-selector { display: flex; gap: 8px; flex-wrap: wrap; }
        .pill-btn {
            flex: 1; min-width: 80px; padding: 10px 12px; background: #09080e;
            border: 1px solid var(--border-subtle); border-radius: 12px; color: var(--text-muted);
            font-size: 13px; font-weight: 700; text-align: center; cursor: pointer;
        }
        .pill-btn.active { background: var(--accent-soft); border-color: var(--accent); color: #ffffff; }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
            display: flex; justify-content: space-around; background: rgba(11, 10, 16, 0.95);
            backdrop-filter: blur(16px); border-top: 1px solid rgba(139, 92, 246, 0.15);
            padding: 10px 6px calc(10px + env(safe-area-inset-bottom));
        }
        .tab-btn {
            background: none; border: none; color: var(--text-muted);
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            font-size: 11px; font-weight: 700; cursor: pointer; padding: 4px 12px; border-radius: 12px;
        }
        .tab-btn.active { color: #c4b5fd; background: rgba(139, 92, 246, 0.1); }
    </style>
</head>
<body>
    <header class="topbar">
        <button id="backBtn" class="back-btn" onclick="goBack()">← Назад</button>
        <div class="brand-mini">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="9" width="4" height="6" rx="1.5" fill="#a78bfa"/>
                <rect x="18" y="9" width="4" height="6" rx="1.5" fill="#a78bfa"/>
                <rect x="6" y="6" width="3" height="12" rx="1.5" fill="#7c3aed"/>
                <rect x="15" y="6" width="3" height="12" rx="1.5" fill="#7c3aed"/>
                <rect x="9" y="10.5" width="6" height="3" fill="#ede9fe"/>
            </svg>
            <span>ZoomerGymCourse</span>
        </div>
    </header>

    <main id="appView" class="container"></main>

    <nav class="bottom-nav">
        <button class="tab-btn active" id="tab-home" onclick="navigate('home', null, true)">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Главная</span>
        </button>
        <button class="tab-btn" id="tab-workouts" onclick="navigate('workouts', null, true)">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
            <span>Тренировки</span>
        </button>
        <button class="tab-btn" id="tab-kbju" onclick="navigate('kbju', null, true)">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            <span>AI Калории</span>
        </button>
        <button class="tab-btn" id="tab-progress" onclick="navigate('progress', null, true)">
            <svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            <span>Прогресс</span>
        </button>
    </nav>

    <script src="data.js"></script>
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        let navStack = [{ screen: 'home', param: null }];

        function navigate(screen, param = null, resetStack = false) {
            if (resetStack) { navStack = [{ screen, param }]; }
            else { navStack.push({ screen, param }); }
            renderCurrent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            if (navStack.length > 1) {
                navStack.pop();
                renderCurrent();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function updateNavUI() {
            document.getElementById('backBtn').style.display = navStack.length > 1 ? 'inline-flex' : 'none';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeTab = document.getElementById(`tab-${navStack[0].screen}`);
            if (activeTab) activeTab.classList.add('active');
        }

        function renderCurrent() {
            const current = navStack[navStack.length - 1];
            updateNavUI();
            const view = document.getElementById('appView');
            switch (current.screen) {
                case 'home': renderHome(view); break;
                case 'nutrition': renderNutrition(view); break;
                case 'workouts': renderWorkouts(view); break;
                case 'exercises': renderMuscleGroups(view); break;
                case 'muscleList': renderExerciseList(view, current.param); break;
                case 'exerciseDetail': renderExerciseDetail(view, current.param); break;
                case 'recovery': renderRecovery(view); break;
                case 'supplements': renderSupplements(view); break;
                case 'kbju': renderKBJU(view); break;
                case 'progress': renderProgress(view); break;
            }
        }

        const ICONS = {
            food: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>',
            workout: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M6.5 6.5h11v11h-11z"></path><path d="M2 12h4.5"></path><path d="M17.5 12H22"></path><path d="M12 2v4.5"></path><path d="M12 17.5V22"></path></svg>',
            exercises: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M2 18h20"></path><path d="M6 14v4"></path><path d="M18 14v4"></path><path d="M3 8h18a1 1 0 0 1 1 1v4H2V9a1 1 0 0 1 1-1z"></path><path d="M7 8V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"></path></svg>',
            recovery: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>',
            supplements: '<svg class="svg-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="5" ry="5"></rect><line x1="12" y1="7" x2="12" y2="17"></line></svg>',
            fire: '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 17c1.38 0 2.5-1.12 2.5-2.5 0-2-3-4-3-6.5 0-1.5 1-2.5 2-3 0 2 2 3.5 3.5 5.5A6 6 0 0 1 20 14a8 8 0 1 1-16 0c0-2.08.8-3.97 2.1-5.4C7.3 10.2 8.5 12.2 8.5 14.5z"></path></svg>'
        };

        function renderHome(view) {
            view.innerHTML = `
                <div class="hero-box">
                    <div class="logo-badge">${ICONS.fire}</div>
                    <h1 class="hero-title">ZoomerGymCourse</h1>
                    <p class="hero-quote">«Всё начинается с малого.»</p>
                    <p class="hero-welcome">Разберись в тренировках, питании и росте мышц за пару минут без лишней воды.</p>
                    <button class="btn-primary" onclick="navigate('workouts')">НАЧАТЬ ТРЕНИРОВКИ</button>
                </div>
                <h2 class="section-heading">Разделы курса</h2>
                <div class="grid-cards">
                    <div class="nav-card" onclick="navigate('nutrition')">
                        <div class="card-icon">${ICONS.food}</div>
                        <div class="card-body"><h3 class="card-title">Питание</h3><p class="card-desc">Калории, БЖУ, дефицит и профицит</p></div>
                    </div>
                    <div class="nav-card" onclick="navigate('workouts')">
                        <div class="card-icon">${ICONS.workout}</div>
                        <div class="card-body"><h3 class="card-title">Тренировки</h3><p class="card-desc">Full Body vs Split и генератор плана</p></div>
                    </div>
                    <div class="nav-card" onclick="navigate('exercises')">
                        <div class="card-icon">${ICONS.exercises}</div>
                        <div class="card-body"><h3 class="card-title">Упражнения</h3><p class="card-desc">Техника по группам мышц и ошибки</p></div>
                    </div>
                    <div class="nav-card" onclick="navigate('recovery')">
                        <div class="card-icon">${ICONS.recovery}</div>
                        <div class="card-body"><h3 class="card-title">Восстановление</h3><p class="card-desc">Сон, стресс и дни отдыха</p></div>
                    </div>
                    <div class="nav-card" onclick="navigate('supplements')">
                        <div class="card-icon">${ICONS.supplements}</div>
                        <div class="card-body"><h3 class="card-title">БАДы / Спортпит</h3><p class="card-desc">Что реально работает</p></div>
                    </div>
                </div>
            `;
        }

        function renderNutrition(view) {
            view.innerHTML = `<h2 class="section-heading">🍽 Основы питания</h2>` + APP_DATA.nutrition.map(item => `
                <div class="info-card"><h3>${item.title}</h3><div class="info-block"><strong>Что это:</strong> ${item.what}</div><div class="info-block"><strong>Зачем нужно:</strong> ${item.why}</div><div class="remember-box">💡 <strong>Запомни:</strong> ${item.remember}</div></div>
            `).join('') + `<button class="btn-primary" onclick="navigate('kbju', null, true)">Открыть AI Калории по фото →</button>`;
        }

        let builderState = { goal: 'hypertrophy', programType: 'FULL BODY', daysPerWeek: 3 };

        function renderWorkouts(view) {
            view.innerHTML = `<h2 class="section-heading">🔥 Тренировки: база</h2>` + APP_DATA.workoutsTheory.map(t => `
                <div class="info-card"><h3>${t.title}</h3><div class="info-block">${t.what}</div><div class="remember-box">💡 <strong>Главное:</strong> ${t.remember}</div></div>
            `).join('') + `
                <div class="info-card">
                    <h3>⚙️ Конструктор программы</h3>
                    <div style="margin-bottom:10px;"><span style="color:var(--text-muted); font-size:13px; display:block; margin-bottom:6px;">Цель:</span>
                        <div class="pill-selector">
                            <button class="pill-btn active" onclick="setBuilder('goal','hypertrophy', this)">Масса</button>
                            <button class="pill-btn" onclick="setBuilder('goal','fatloss', this)">Сушка</button>
                            <button class="pill-btn" onclick="setBuilder('goal','strength', this)">Сила</button>
                        </div>
                    </div>
                    <div style="margin-bottom:10px;"><span style="color:var(--text-muted); font-size:13px; display:block; margin-bottom:6px;">Тип:</span>
                        <div class="pill-selector">
                            <button class="pill-btn active" onclick="setBuilder('programType','FULL BODY', this)">FULL BODY</button>
                            <button class="pill-btn" onclick="setBuilder('programType','SPLIT', this)">SPLIT</button>
                        </div>
                    </div>
                    <button class="btn-primary" style="margin-top:14px;" onclick="buildUserPlan()">Сгенерировать план</button>
                </div>
                <div id="generatedPlanBox"></div>
            `;
        }

        function setBuilder(key, val, btnEl) {
            builderState[key] = val;
            btnEl.parentElement.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
        }

        function buildUserPlan() {
            const plan = generateWorkoutPlan(builderState);
            document.getElementById('generatedPlanBox').innerHTML = plan.map(day => `
                <div class="info-card"><h3>📅 ${day.dayTitle}</h3>${day.items.map((ex, i) => `
                    <div style="padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center;" onclick="navigate('exerciseDetail', '${ex.slug}')">
                        <div><div style="font-weight:700; font-size:14px;">${i + 1}. ${ex.name}</div><div style="font-size:12px; color:var(--text-muted);">${ex.muscle}</div></div>
                        <div class="badge" style="margin:0;">${ex.sets} × ${ex.reps}</div>
                    </div>`).join('')}</div>
            `).join('');
        }

        function renderMuscleGroups(view) {
            view.innerHTML = `<h2 class="section-heading">💪 Группы мышц</h2><div class="grid-cards">` + APP_DATA.muscleGroups.map(m => `
                <div class="nav-card" onclick="navigate('muscleList', '${m.id}')"><div class="card-icon" style="font-size:20px;">${m.icon}</div><div class="card-body"><h3 class="card-title">${m.id}</h3><p class="card-desc">${m.subtitle}</p></div></div>
            `).join('') + `</div>`;
        }

        function renderExerciseList(view, muscleGroup) {
            const list = APP_DATA.exercises.filter(e => e.muscleGroup === muscleGroup);
            view.innerHTML = `<h2 class="section-heading">${muscleGroup}</h2><div class="grid-cards">` + list.map(ex => `
                <div class="nav-card" onclick="navigate('exerciseDetail', '${ex.slug}')"><div class="card-icon">${ICONS.workout}</div><div class="card-body"><h3 class="card-title">${ex.name}</h3><p class="card-desc">${ex.equipment} • ${ex.recommendedSets} × ${ex.recommendedReps}</p></div></div>
            `).join('') + `</div>`;
        }

        function renderExerciseDetail(view, slug) {
            const ex = APP_DATA.exercises.find(e => e.slug === slug);
            if (!ex) return;
            const images = ex.images || (ex.image ? [ex.image] : []);
            view.innerHTML = `
                <h2 class="section-heading">${ex.name}</h2>
                <div class="media-box">${images.map(img => `<img src="${img}" onerror="this.outerHTML='<div class=\\'media-placeholder\\'>📸 Фото скоро появится</div>'">`).join('')}</div>
                <div style="margin-bottom:14px;"><span class="badge">Сложность: ${ex.difficulty}</span><span class="badge">Подходы: ${ex.recommendedSets}</span></div>
                <div class="info-card"><h3>🎯 Мышцы</h3><div class="info-block"><strong>Главная:</strong> ${ex.muscleGroup}</div><div class="info-block"><strong>Помогают:</strong> ${ex.secondaryMuscles.join(', ')}</div></div>
                <div class="info-card"><h3>✅ Техника</h3>${ex.steps.map((s, i) => `<div class="info-block"><strong>${i + 1}.</strong> ${s}</div>`).join('')}</div>
                <div class="info-card"><h3>⚠️ Ошибки</h3>${ex.mistakes.map(m => `<div class="info-block">• ${m}</div>`).join('')}</div>
            `;
        }

        function renderRecovery(view) {
            view.innerHTML = `<h2 class="section-heading">😴 Восстановление</h2>` + APP_DATA.recovery.map(r => `
                <div class="info-card"><h3>${r.icon} ${r.title}</h3><div class="info-block"><strong>Что это:</strong> ${r.what}</div><div class="remember-box">💡 <strong>Запомни:</strong> ${r.remember}</div></div>
            `).join('');
        }

        function renderSupplements(view) {
            view.innerHTML = `<h2 class="section-heading">💊 БАДы и Спортпит</h2><div class="remember-box" style="background:rgba(245,158,11,0.12); border-left-color:#f59e0b; margin-bottom:16px;">⚠️ <strong>Предупреждение:</strong> ${APP_DATA.supplementsWarning}</div>` + APP_DATA.supplements.map(s => `
                <div class="info-card"><h3>${s.name}</h3><span class="badge">${s.importance}</span><div class="info-block"><strong>Что это:</strong> ${s.what}</div></div>
            `).join('');
        }

        // Экран AI Калории по фото
        function renderKBJU(view) {
            view.innerHTML = `
                <h2 class="section-heading">📸 AI Подсчет калорий по фото</h2>
                <div class="info-card" style="text-align: center; padding: 24px 16px;">
                    <div style="font-size: 48px; margin-bottom: 12px;">🥗</div>
                    <h3 style="margin-bottom: 8px;">Как узнать калории по фото?</h3>
                    <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">
                        Нейросеть мгновенно посчитает КБЖУ твоего блюда прямо в чате с ботом.
                    </p>
                    <div class="remember-box" style="text-align: left; margin-bottom: 20px;">
                        👉 Нажми на кнопку ниже и просто отправь фото своей тарелки в чат с ботом!
                    </div>
                    <button class="btn-primary" onclick="window.Telegram.WebApp.close()">
                        📤 Отправить фото боту в чат
                    </button>
                </div>
            `;
        }

        function renderProgress(view) {
            view.innerHTML = `<h2 class="section-heading">📊 Прогресс</h2><div class="info-card"><h3>⚖️ Вес тела</h3><div style="display:flex; gap:8px;"><input id="pBodyWeight" type="number" step="0.1" class="style="flex:1;" style="background:#09080e; border:1px solid var(--border-subtle); border-radius:12px; color:var(--text-main); padding:12px;" placeholder="Кг"><button class="btn-primary" style="width:auto;" onclick="addBodyWeight()">+</button></div></div>`;
        }

        function addBodyWeight() {
            const val = parseFloat(document.getElementById('pBodyWeight').value);
            if (!val) return;
            let data = JSON.parse(localStorage.getItem('zgc_progress') || '{"weights":[]}');
            data.weights.push({ val });
            localStorage.setItem('zgc_progress', JSON.stringify(data));
            alert('Вес сохранен!');
        }

        renderCurrent();
    </script>
</body>
</html>
