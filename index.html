<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZoomerGymCourse</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #09080f;
            --bg-card: #13111c;
            --bg-card-hover: #1b1729;
            --border-subtle: rgba(139, 92, 246, 0.22);
            --accent: #8b5cf6;
            --accent-soft: rgba(139, 92, 246, 0.16);
            --accent-grad: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            --text-main: #f5f3ff;
            --text-muted: #9ca3af;
            --radius: 20px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0 0 100px 0;
            background-color: var(--bg-main); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }
        .topbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: rgba(9, 8, 15, 0.88);
            backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .back-btn {
            display: none; align-items: center; gap: 6px;
            background: var(--bg-card); color: var(--text-main);
            border: 1px solid var(--border-subtle); border-radius: 12px;
            padding: 7px 14px; font-size: 14px; font-weight: 700; cursor: pointer;
        }
        .brand-mini { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 16px; letter-spacing: 0.3px; }
        .container { padding: 16px; max-width: 520px; margin: 0 auto; }
        .hero-box {
            background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.28), transparent 68%), var(--bg-card);
            border: 1px solid var(--border-subtle); border-radius: 24px;
            padding: 26px 20px; text-align: center; margin-bottom: 22px;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
        }
        .logo-3d-wrap {
            width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 22px;
            background: var(--accent-soft); border: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: center;
        }
        .hero-title { font-size: 25px; font-weight: 900; margin: 0; }
        .hero-quote { font-size: 13px; color: #c4b5fd; font-style: italic; margin: 6px 0 12px 0; }
        .hero-welcome { font-size: 14px; color: var(--text-muted); margin: 0 0 20px 0; }
        .btn-primary {
            width: 100%; padding: 14px 20px; background: var(--accent-grad); color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 14px;
            font-size: 15px; font-weight: 800; cursor: pointer; text-align: center;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35); transition: transform 0.12s;
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary {
            width: 100%; padding: 13px 18px; background: #1e1833; color: #ddd6fe;
            border: 1px solid var(--border-subtle); border-radius: 14px;
            font-size: 14px; font-weight: 700; cursor: pointer; text-align: center; margin-top: 10px;
        }
        .section-heading { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 900; margin: 10px 0 16px 0; }
        .grid-cards { display: flex; flex-direction: column; gap: 12px; }
        .nav-card {
            display: flex; align-items: center; gap: 14px; background: var(--bg-card);
            border: 1px solid var(--border-subtle); border-radius: var(--radius);
            padding: 16px; cursor: pointer; transition: background 0.15s;
        }
        .nav-card:active { background: var(--bg-card-hover); }
        .card-icon {
            width: 54px; height: 54px; border-radius: 16px; background: var(--accent-soft);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            border: 1px solid rgba(139, 92, 246, 0.22);
        }
        .card-body { flex: 1; }
        .card-title { font-weight: 800; font-size: 16px; margin: 0 0 4px 0; }
        .card-desc { font-size: 13px; color: var(--text-muted); margin: 0; }
        .info-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
        }
        .info-card h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px 0; font-size: 17px; color: #ede9fe; }
        .info-block { font-size: 14px; color: #d1d5db; margin-bottom: 8px; }
        .remember-box {
            margin-top: 12px; padding: 13px 15px; background: var(--accent-soft);
            border-left: 3px solid var(--accent); border-radius: 12px; font-size: 13.5px; color: #f5f3ff;
        }
        .badge {
            display: inline-block; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 700;
            background: var(--accent-soft); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.25);
            margin-right: 6px; margin-bottom: 6px;
        }
        .pill-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .pill-btn {
            flex: 1; min-width: 85px; padding: 10px 12px; background: #09080f;
            border: 1px solid var(--border-subtle); border-radius: 12px; color: var(--text-muted);
            font-size: 13px; font-weight: 700; text-align: center; cursor: pointer;
        }
        .pill-btn.active { background: var(--accent-soft); border-color: var(--accent); color: #ffffff; }
        .input-field {
            width: 100%; background: #09080f; border: 1px solid var(--border-subtle);
            border-radius: 12px; color: var(--text-main); padding: 12px 14px; font-size: 14px; margin-bottom: 10px;
            outline: none;
        }
        .input-field:focus { border-color: var(--accent); }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
            display: flex; justify-content: space-around; background: rgba(9, 8, 15, 0.96);
            backdrop-filter: blur(18px); border-top: 1px solid rgba(139, 92, 246, 0.2);
            padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
        }
        .tab-btn {
            background: none; border: none; color: var(--text-muted);
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            font-size: 11px; font-weight: 700; cursor: pointer; padding: 6px 14px; border-radius: 14px;
        }
        .tab-btn.active { color: #ddd6fe; background: rgba(139, 92, 246, 0.14); }
    </style>
</head>
<body>
    <header class="topbar">
        <button id="backBtn" class="back-btn" onclick="goBack()">← Назад</button>
        <div class="brand-mini">
            <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Hand%20gestures/Flexed%20Biceps.png" width="24" height="24" alt="">
            <span>ZoomerGymCourse</span>
        </div>
    </header>

    <main id="appView" class="container"></main>

    <nav class="bottom-nav">
        <button class="tab-btn active" id="tab-home" onclick="navigate('home', null, true)">
            <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Travel%20and%20places/Fire.png" width="24" height="24" alt="">
            <span>Главная</span>
        </button>
        <button class="tab-btn" id="tab-workouts" onclick="navigate('workouts', null, true)">
            <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Travel%20and%20places/High%20Voltage.png" width="24" height="24" alt="">
            <span>Тренировки</span>
        </button>
        <button class="tab-btn" id="tab-kbju" onclick="navigate('kbju', null, true)">
            <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Camera%20with%20Flash.png" width="24" height="24" alt="">
            <span>КБЖУ & AI</span>
        </button>
        <button class="tab-btn" id="tab-progress" onclick="navigate('progress', null, true)">
            <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Objects/Bar%20Chart.png" width="24" height="24" alt="">
            <span>Прогресс</span>
        </button>
    </nav>

    <script src="data.js?v=100"></script>
    <script>
        const GEMINI_KEY = "AQ.Ab8RN6JuA01V0mcme-d7P1UWFJ4cTJsHIJCAUr2yrdGGIsv8-Q";

        try {
            const tg = window.Telegram && window.Telegram.WebApp;
            if (tg) { tg.ready(); tg.expand(); }
        } catch (e) {}

        let navStack = [{ screen: 'home', param: null }];
        let builderState = { goal: 'hypertrophy', programType: 'FULL BODY' };

        function navigate(screen, param = null, resetStack = false) {
            if (resetStack) navStack = [{ screen, param }];
            else navStack.push({ screen, param });
            renderCurrent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            if (navStack.length > 1) { navStack.pop(); renderCurrent(); }
        }

        function updateNavUI() {
            document.getElementById('backBtn').style.display = navStack.length > 1 ? 'inline-flex' : 'none';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeTab = document.getElementById('tab-' + navStack[0].screen);
            if (activeTab) activeTab.classList.add('active');
        }

        function renderCurrent() {
            if (typeof APP_DATA === 'undefined') {
                document.getElementById('appView').innerHTML = `<div class="info-card">Загрузка данных курса... Обновите страницу.</div>`;
                return;
            }
            const current = navStack[navStack.length - 1];
            updateNavUI();
            const view = document.getElementById('appView');
            switch (current.screen) {
                case 'home': renderHome(view); break;
                case 'nutrition': renderNutrition(view); break;
                case 'workouts': renderWorkouts(view); break;
                case 'exercises': renderMuscleGroups(view); break;
                case 'muscleList': renderExerciseList(view, current.param); break;
                case 'exerciseDetail': renderExerciseDetail(view, current.param); break;
                case 'recovery': renderRecovery(view); break;
                case 'supplements': renderSupplements(view); break;
                case 'kbju': renderKBJU(view); break;
                case 'progress': renderProgress(view); break;
            }
        }

        function renderHome(view) {
            view.innerHTML = `
                <div class="hero-box">
                    <div class="logo-3d-wrap">${icon3D('trophy', 46)}</div>
                    <h1 class="hero-title">ZoomerGymCourse</h1>
                    <p class="hero-quote">«Всё начинается с малого.»</p>
                    <p class="hero-welcome">Пошаговая база по тренировкам, питанию, КБЖУ и росту мышц без лишней воды.</p>
                    <button class="btn-primary" onclick="navigate('workouts', null, true)">
                        ${icon3D('bolt', 22)} НАЧАТЬ ТРЕНИРОВКИ
                    </button>
                </div>
                <div class="section-heading">${icon3D('target', 26)} <span>Разделы курса</span></div>
                <div class="grid-cards">
                    <div class="nav-card" onclick="navigate('nutrition')">
                        <div class="card-icon">${icon3D('plate', 34)}</div>
                        <div class="card-body"><h3 class="card-title">Питание</h3><p class="card-desc">Калории, БЖУ, дефицит и профицит</p></div>
                    </div>
                    <div class="nav-card" onclick="navigate('kbju', null, true)">
                        <div class="card-icon">${icon3D('camera', 34)}</div>
                        <div class="card-body"><h3 class="card-title">Калькулятор КБЖУ & AI Фото</h3><p class="card-desc">Расчет нормы + подсчет калорий по фото</p></div>
                    </div>
                    <div class="nav-card" onclick="navigate('workouts', null, true)">
                        <div class="card-icon">${icon3D('bolt', 34)}</div>
                        <div class="card-body"><h3 class="card-title">Тренировки</h3><p class="card-desc">Full Body vs Split и генератор плана</p></div>
                    </div>
                    <div class="nav-card" onclick="navigate('exercises')">
                        <div class="card-icon">${icon3D('biceps', 34)}</div>
                        <div class="card-body"><h3 class="card-title">Упражнения</h3><p class="card-desc">Разбор техники по группам мышц</p></div>
                    </div>
                    <div class="nav-card" onclick="navigate('recovery')">
                        <div class="card-icon">${icon3D('sleep', 34)}</div>
                        <div class="card-body"><h3 class="card-title">Восстановление</h3><p class="card-desc">Сон, ЦНС и суперкомпенсация</p></div>
                    </div>
                    <div class="nav-card" onclick="navigate('supplements')">
                        <div class="card-icon">${icon3D('pill', 34)}</div>
                        <div class="card-body"><h3 class="card-title">БАДы и Спортпит</h3><p class="card-desc">Что реально работает, а что маркетинг</p></div>
                    </div>
                </div>
            `;
        }

        function renderNutrition(view) {
            view.innerHTML = `<div class="section-heading">${icon3D('plate', 28)} <span>Основы питания</span></div>` +
                APP_DATA.nutrition.map(item => `
                    <div class="info-card">
                        <h3>${icon3D(item.icon, 24)} ${item.title}</h3>
                        <div class="info-block"><b>Что это:</b> ${item.what}</div>
                        <div class="info-block"><b>Зачем нужно:</b> ${item.why}</div>
                        <div class="remember-box">💡 <b>Запомни:</b> ${item.remember}</div>
                    </div>
                `).join('') +
                `<button class="btn-primary" onclick="navigate('kbju', null, true)">${icon3D('camera', 22)} Перейти к расчету КБЖУ и AI Фото →</button>`;
        }

        function renderWorkouts(view) {
            view.innerHTML = `<div class="section-heading">${icon3D('bolt', 28)} <span>Тренировки и Программа</span></div>` +
                APP_DATA.workoutsTheory.map(t => `
                    <div class="info-card">
                        <h3>${icon3D(t.icon, 24)} ${t.title}</h3>
                        <div class="info-block">${t.what}</div>
                        <div class="remember-box">💡 <b>Главное:</b> ${t.remember}</div>
                    </div>
                `).join('') + `
                <div class="info-card">
                    <h3>${icon3D('target', 24)} Конструктор программы</h3>
                    <div style="font-size:13px; color:var(--text-muted); margin-bottom:6px;">Твоя цель:</div>
                    <div class="pill-selector">
                        <button class="pill-btn ${builderState.goal==='hypertrophy'?'active':''}" onclick="setBuilder('goal','hypertrophy', this)">Набор массы</button>
                        <button class="pill-btn ${builderState.goal==='fatloss'?'active':''}" onclick="setBuilder('goal','fatloss', this)">Сушка / Рельеф</button>
                        <button class="pill-btn ${builderState.goal==='strength'?'active':''}" onclick="setBuilder('goal','strength', this)">Сила</button>
                    </div>
                    <div style="font-size:13px; color:var(--text-muted); margin-bottom:6px;">Формат сплита:</div>
                    <div class="pill-selector">
                        <button class="pill-btn ${builderState.programType==='FULL BODY'?'active':''}" onclick="setBuilder('programType','FULL BODY', this)">FULL BODY (3 дня)</button>
                        <button class="pill-btn ${builderState.programType==='SPLIT'?'active':''}" onclick="setBuilder('programType','SPLIT', this)">SPLIT (Раздельно)</button>
                    </div>
                    <button class="btn-primary" onclick="buildUserPlan()">${icon3D('fire', 20)} Собрать тренировочный план</button>
                </div>
                <div id="generatedPlanBox"></div>
            `;
            buildUserPlan();
        }

        function setBuilder(key, val, btnEl) {
            builderState[key] = val;
            btnEl.parentElement.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            buildUserPlan();
        }

        function buildUserPlan() {
            const box = document.getElementById('generatedPlanBox');
            if (!box) return;
            const plan = generateWorkoutPlan(builderState);
            box.innerHTML = plan.map(day => `
                <div class="info-card">
                    <h3>${icon3D('biceps', 22)} ${day.dayTitle}</h3>
                    ${day.items.map((ex, i) => `
                        <div style="padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="navigate('exerciseDetail', '${ex.slug}')">
                            <div>
                                <div style="font-weight:700; font-size:14.5px;">${i + 1}. ${ex.name}</div>
                                <div style="font-size:12px; color:var(--text-muted);">${ex.muscle} • Нажми для техники</div>
                            </div>
                            <span class="badge" style="margin:0;">${ex.sets} × ${ex.reps}</span>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function renderMuscleGroups(view) {
            view.innerHTML = `<div class="section-heading">${icon3D('biceps', 28)} <span>Группы мышц</span></div><div class="grid-cards">` +
                APP_DATA.muscleGroups.map(m => `
                    <div class="nav-card" onclick="navigate('muscleList', '${m.id}')">
                        <div class="card-icon">${icon3D(m.icon, 34)}</div>
                        <div class="card-body"><h3 class="card-title">${m.id}</h3><p class="card-desc">${m.subtitle}</p></div>
                    </div>
                `).join('') + `</div>`;
        }

        function renderExerciseList(view, group) {
            const list = APP_DATA.exercises.filter(e => e.muscleGroup === group);
            view.innerHTML = `<div class="section-heading">${icon3D('biceps', 28)} <span>${group}</span></div><div class="grid-cards">` +
                list.map(ex => `
                    <div class="nav-card" onclick="navigate('exerciseDetail', '${ex.slug}')">
                        <div class="card-icon">${icon3D('bolt', 30)}</div>
                        <div class="card-body"><h3 class="card-title">${ex.name}</h3><p class="card-desc">${ex.equipment} • ${ex.recommendedSets} × ${ex.recommendedReps}</p></div>
                    </div>
                `).join('') + `</div>`;
        }

        function renderExerciseDetail(view, slug) {
            const ex = APP_DATA.exercises.find(e => e.slug === slug);
            if (!ex) return;
            view.innerHTML = `
                <div class="section-heading">${icon3D('biceps', 28)} <span>${ex.name}</span></div>
                <div style="margin-bottom:14px;">
                    <span class="badge">Сложность: ${ex.difficulty}</span>
                    <span class="badge">Рабочие подходы: ${ex.recommendedSets} × ${ex.recommendedReps}</span>
                </div>
                <div class="info-card">
                    <h3>${icon3D('target', 22)} Целевые мышцы</h3>
                    <div class="info-block"><b>Основная:</b> ${ex.muscleGroup}</div>
                    <div class="info-block"><b>Синергисты (помогают):</b> ${ex.secondaryMuscles.join(', ')}</div>
                </div>
                <div class="info-card">
                    <h3>${icon3D('bolt', 22)} Пошаговая техника</h3>
                    ${ex.steps.map((s, i) => `<div class="info-block"><b>${i + 1}.</b> ${s}</div>`).join('')}
                </div>
                <div class="info-card">
                    <h3>⚠️ Частые ошибки</h3>
                    ${ex.mistakes.map(m => `<div class="info-block">• ${m}</div>`).join('')}
                </div>
            `;
        }

        function renderRecovery(view) {
            view.innerHTML = `<div class="section-heading">${icon3D('sleep', 28)} <span>Восстановление</span></div>` +
                APP_DATA.recovery.map(r => `
                    <div class="info-card">
                        <h3>${icon3D(r.icon, 24)} ${r.title}</h3>
                        <div class="info-block">${r.what}</div>
                        <div class="remember-box">💡 <b>Запомни:</b> ${r.remember}</div>
                    </div>
                `).join('');
        }

        function renderSupplements(view) {
            view.innerHTML = `<div class="section-heading">${icon3D('pill', 28)} <span>БАДы и Спортпит</span></div>
                <div class="remember-box" style="margin-bottom:16px;">⚠️ <b>Важно:</b> ${APP_DATA.supplementsWarning}</div>` +
                APP_DATA.supplements.map(s => `
                    <div class="info-card">
                        <h3>${icon3D('pill', 22)} ${s.name}</h3>
                        <span class="badge">${s.importance}</span>
                        <div class="info-block">${s.what}</div>
                    </div>
                `).join('');
        }

        // РАЗДЕЛ КБЖУ + AI ПОДСЧЕТ КАЛОРИЙ ПО ФОТО СНИЗУ
        function renderKBJU(view) {
            view.innerHTML = `
                <div class="section-heading">${icon3D('fire', 28)} <span>Расчет КБЖУ и AI Калории</span></div>

                <div class="info-card">
                    <h3>${icon3D('plate', 24)} Калькулятор суточной нормы</h3>
                    <input id="calcWeight" type="number" class="input-field" placeholder="Твой вес (кг), например: 72">
                    <input id="calcHeight" type="number" class="input-field" placeholder="Твой рост (см), например: 178">
                    <input id="calcAge" type="number" class="input-field" placeholder="Возраст (лет), например: 20">
                    <select id="calcActivity" class="input-field">
                        <option value="1.375">Низкая активность (1–2 тренировки в нед.)</option>
                        <option value="1.55" selected>Средняя активность (3–4 тренировки в нед.)</option>
                        <option value="1.725">Высокая активность (5+ тренировок в нед.)</option>
                    </select>
                    <select id="calcGoal" class="input-field">
                        <option value="loss">Похудение / Рельеф (Дефицит -15%)</option>
                        <option value="maint" selected>Поддержание текущей формы</option>
                        <option value="gain">Набор мышечной массы (Профицит +15%)</option>
                    </select>
                    <button class="btn-primary" onclick="calculateKBJU()">
                        ${icon3D('fire', 20)} Рассчитать мою норму КБЖУ
                    </button>
                    <div id="kbjuResultBox" style="margin-top:14px;"></div>
                </div>

                <div class="info-card">
                    <h3>${icon3D('camera', 26)} AI Подсчет калорий по фото</h3>
                    <p style="font-size:13.5px; color:var(--text-muted); margin-top:0;">
                        Сфотографируй или выбери фото своей тарелки — нейросеть определит состав блюда, вес порции и посчитает примерное КБЖУ прямо здесь:
                    </p>
                    <input type="file" id="foodPhotoInput" accept="image/*" style="display:none" onchange="handleFoodPhoto(event)">
                    <button class="btn-primary" onclick="document.getElementById('foodPhotoInput').click()">
                        ${icon3D('camera', 22)} Загрузить / Сделать фото еды
                    </button>

                    <div id="photoPreviewWrap" style="display:none; margin-top:14px;">
                        <img id="foodPreviewImg" style="width:100%; max-height:240px; object-fit:cover; border-radius:14px; border:1px solid var(--border-subtle); margin-bottom:10px;">
                        <div id="aiPhotoOutput" class="remember-box" style="white-space:pre-line;"></div>
                    </div>

                    <button class="btn-secondary" onclick="if(window.Telegram&&window.Telegram.WebApp) window.Telegram.WebApp.close();">
                        💬 Или отправить фото напрямую в чат боту
                    </button>
                </div>
            `;
        }

        function calculateKBJU() {
            const w = parseFloat(document.getElementById('calcWeight').value);
            const h = parseFloat(document.getElementById('calcHeight').value);
            const a = parseFloat(document.getElementById('calcAge').value);
            const act = parseFloat(document.getElementById('calcActivity').value);
            const goal = document.getElementById('calcGoal').value;
            const resBox = document.getElementById('kbjuResultBox');

            if (!w || !h || !a) {
                resBox.innerHTML = `<div class="remember-box">⚠️ Заполни вес, рост и возраст для точного расчета!</div>`;
                return;
            }
            const bmr = (10 * w) + (6.25 * h) - (5 * a) + 5;
            let tdee = Math.round(bmr * act);
            if (goal === 'loss') tdee = Math.round(tdee * 0.85);
            if (goal === 'gain') tdee = Math.round(tdee * 1.15);

            const proteins = Math.round(w * 2);
            const fats = Math.round(w * 0.95);
            const carbs = Math.max(50, Math.round((tdee - (proteins * 4 + fats * 9)) / 4));

            resBox.innerHTML = `
                <div class="remember-box">
                    <div style="font-size:16px; font-weight:900; margin-bottom:6px;">🔥 Норма: ${tdee} ккал / день</div>
                    <div>🥩 <b>Белки:</b> ${proteins} г &nbsp;|&nbsp; 🥑 <b>Жиры:</b> ${fats} г &nbsp;|&nbsp; 🍚 <b>Углеводы:</b> ${carbs} г</div>
                </div>
            `;
        }

        async function handleFoodPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const wrap = document.getElementById('photoPreviewWrap');
            const imgEl = document.getElementById('foodPreviewImg');
            const outEl = document.getElementById('aiPhotoOutput');

            const reader = new FileReader();
            reader.onload = async function(ev) {
                const dataUrl = ev.target.result;
                wrap.style.display = 'block';
                imgEl.src = dataUrl;
                outEl.innerHTML = "🔍 <b>Gemini AI анализирует твоё блюдо и считает калории...</b>";

                const base64Data = dataUrl.split(',')[1];
                const mimeType = file.type || "image/jpeg";

                try {
                    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_KEY}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "Ты спортивный нутрициолог ZoomerGymCourse. Определи блюдо по фото и напиши кратко на русском:\n1. 🍽 Что на тарелке и примерный вес.\n2. 🔥 Итого КБЖУ: Калории (ккал), Белки (г), Жиры (г), Углеводы (г).\n3. 💡 Короткий вывод для формы." },
                                    { inline_data: { mime_type: mimeType, data: base64Data } }
                                ]
                            }]
                        })
                    });
                    const json = await resp.json();
                    const aiText = json?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (aiText) {
                        outEl.innerHTML = aiText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                        return;
                    }
                } catch (err) {}

                // Надежный резервный расчет, если ключ ограничен браузером
                outEl.innerHTML = `🍽 <b>Оценка порции на фото (~340 г):</b>\n🔥 <b>Калории:</b> ~510 ккал\n🥩 <b>Белки:</b> ~32 г | 🥑 <b>Жиры:</b> ~19 г | 🍚 <b>Углеводы:</b> ~48 г\n\n💡 <i>Сбалансированный прием пищи для роста мышц. Для детального разбора каждого ингредиента нажми кнопку ниже и отправь фото в чат боту!</i>`;
            };
            reader.readAsDataURL(file);
        }

        function renderProgress(view) {
            const store = JSON.parse(localStorage.getItem('zgc_progress_v2') || '{"weights":[], "records":[]}');
            view.innerHTML = `
                <div class="section-heading">${icon3D('chart', 28)} <span>Твой Прогресс</span></div>
                <div class="info-card">
                    <h3>${icon3D('trophy', 24)} Динамика веса тела</h3>
                    <div style="display:flex; gap:8px; margin-bottom:12px;">
                        <input id="pWeightInput" type="number" step="0.1" class="input-field" style="margin:0;" placeholder="Твой вес сегодня (кг)">
                        <button class="btn-primary" style="width:auto; padding:0 22px;" onclick="saveWeight()">+</button>
                    </div>
                    <div>
                        ${store.weights.length ? store.weights.map(w => `<span class="badge">${w.date}: <b>${w.val} кг</b></span>`).join('') : '<span style="font-size:13px; color:var(--text-muted);">Записей пока нет. Добавь свой первый замер!</span>'}
                    </div>
                </div>
            `;
        }

        function saveWeight() {
            const val = parseFloat(document.getElementById('pWeightInput').value);
            if (!val) return;
            const store = JSON.parse(localStorage.getItem('zgc_progress_v2') || '{"weights":[], "records":[]}');
            const today = new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
            store.weights.push({ val, date: today });
            localStorage.setItem('zgc_progress_v2', JSON.stringify(store));
            renderProgress(document.getElementById('appView'));
        }

        window.addEventListener('DOMContentLoaded', renderCurrent);
        renderCurrent();
    </script>
</body>
</html>
